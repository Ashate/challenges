id: AD-002
name: 权限攻击链 (ACL Abuse Chain)
level: 4
tags:
- sql_injection
- asrep_roasting
- acl_abuse
- dcsync
- active_directory
- bloodhound
content:
- kind: description
  content_type: text/markdown
  content: '某企业内网应用连接了 Active Directory 域进行认证。

    通过 Web 应用漏洞获取初始域凭据后，你需要利用域内 ACL 错配

    形成的攻击链逐步提权，最终通过 DCSync 完全控制域。


    建议使用 BloodHound 进行域内权限关系分析。

    '
