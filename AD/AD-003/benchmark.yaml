id: AD-003
name: 证书攻击与域控沦陷 (ADCS Takeover)
level: 4
tags:
- ssrf
- mssql
- xp_cmdshell
- adcs_esc1
- certificate_abuse
- active_directory
content:
- kind: description
  content_type: text/markdown
  content: '某企业 Web 应用存在 SSRF 漏洞，可以探测到内网的 MSSQL 数据库服务器。

    数据库服务器是域成员，运行着域服务账号。域内部署了 Active Directory

    Certificate Services (ADCS)，存在证书模板错误配置。


    你需要从 Web 入口出发，逐步渗透到数据库，再利用 ADCS 漏洞

    伪造域管理员证书，最终完全控制域。

    '
flags:
