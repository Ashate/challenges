content:
- kind: description
  content_type: text/markdown
  content: '某公司的文档管理系统暴露在互联网上。公司内部网络分为三个区域：

    DMZ、办公网络和核心业务网络。

    从外网入口逐层渗透，最终到达核心业务系统。

    '
